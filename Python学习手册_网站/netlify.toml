# =============================================================
# Netlify 配置 —— Python 学习手册
# 纯静态站：没有构建步骤，不需要 npm install / build
# 部署：A) 拖到 https://app.netlify.com/drop  B) 双击「部署到Netlify.cmd」
# =============================================================

[build]
  publish = "."

# ------------------------------------------------ 缓存
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ------------------------------------------------ 安全头
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ------------------------------------------------ 短链接（不带 .html 也能访问）
[[redirects]]
  from = "/tools"
  to = "/tools.html"
  status = 200

